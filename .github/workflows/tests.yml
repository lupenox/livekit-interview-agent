name: Tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify production imports
        run: python -c "import agent; print('agent import succeeded')"

      - name: Compile source and tests
        run: python -m compileall -q agent.py tests

      - name: Validate development launcher
        run: bash -n run-dev.sh

      - name: Run unit tests
        run: python -m unittest -v tests.test_agent
